<ion-header>
  <ion-toolbar>
    <ion-title>Agregar Película</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="crearPelicula()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input [(ngModel)]="nombre" name="nombre" required></ion-input><br>
    </ion-item>
    
    <ion-item>
      <ion-label position="floating">Año</ion-label>
      <ion-input [(ngModel)]="anio" name="anio" type="number" required></ion-input><br>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Director</ion-label>
      <ion-input [(ngModel)]="director" name="director" required></ion-input><br><br>
    </ion-item>

    <ion-button expand="block" routerLink="/lista-peliculas" type="submit" class="ion-margin-top" shape="round">
      Guardar Película
    </ion-button>
  </form>
</ion-content>
