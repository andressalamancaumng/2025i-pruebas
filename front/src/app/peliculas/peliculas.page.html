<ion-header>
  <ion-toolbar>
    <ion-title>Agregar Película</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (Submit)="crearPelicula() ; $event.preventDefault();">
    <ion-item>
      <ion-label position="floating">Nombre: </ion-label>
      <ion-input [(ngModel)]="nombre" name="nombre" required></ion-inp ut>
    </ion-item>
    
    <ion-item>
      <ion-label position="floating">Año: </ion-label>
      <ion-input [(ngModel)]="anio" name="anio" type="number" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Director: </ion-label>
      <ion-input [(ngModel)]="director" name="director" required></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top" shape="round">
      Guardar Película
    </ion-button>
    <ion-button expand="block" color="danger" routerLink="/lista-peliculas" class="ion-margin-top" shape="round">
      Cancelar
    </ion-button>
  </form>
</ion-content>
