<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Gestión de Carros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Registrar nuevo carro</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form (ngSubmit)="agregarCarro()" #carroForm="ngForm">
        <ion-item>
          <ion-label position="floating">Modelo</ion-label>
          <ion-input
            type="number"
            [(ngModel)]="nuevoCarro.modelo"
            name="modelo"
            required
            ngModel>
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Marca</ion-label>
          <ion-input
            type="text"
            [(ngModel)]="nuevoCarro.marca"
            name="marca"
            required
            ngModel>
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Serie</ion-label>
          <ion-input
            type="text"
            [(ngModel)]="nuevoCarro.serie"
            name="serie"
            required
            ngModel>
          </ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" color="success">
          Agregar
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <ion-list *ngIf="carros.length > 0; else sinCarros">
    <ion-list-header>
      <ion-label>Lista de Carros Registrados</ion-label>
    </ion-list-header>

    <ion-item *ngFor="let carro of carros">
      <ion-label>
        <h2>{{ carro.modelo }} - {{ carro.marca }}</h2>
        <p>Serie: {{ carro.serie }}</p>
      </ion-label>
      <ion-button fill="clear" slot="end" color="danger" (click)="eliminarCarro(carro.id)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ng-template #sinCarros>
    <ion-text color="medium"><p class="ion-padding">No hay carros registrados.</p></ion-text>
  </ng-template>


  <ion-card *ngIf="carros.length === 0">
    <ion-card-content class="ion-text-center">
      No hay carros registrados.
    </ion-card-content>
  </ion-card>

</ion-content>
