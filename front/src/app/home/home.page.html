<ion-header>
  <ion-toolbar>
    <ion-title>Lista de Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- FORMULARIO CREAR USUARIO -->
  <ion-input
    [(ngModel)]="newUser.name"
    placeholder="Nombre"
    label="Nombre"
    labelPlacement="floating"
    type="text"
  ></ion-input>

  <ion-input
    [(ngModel)]="newUser.email"
    placeholder="Correo"
    label="Correo"
    labelPlacement="floating"
    type="email"
  ></ion-input>

  <ion-input
    [(ngModel)]="newUser.document"
    placeholder="Documento"
    label="Documento"
    labelPlacement="floating"
    type="text"
  ></ion-input>

  <ion-button expand="block" (click)="createUser()">Crear Usuario</ion-button>

  <!-- BUSCAR USUARIO -->
  <ion-input
    [(ngModel)]="searchQuery"
    placeholder="Buscar por nombre, correo o documento"
    label="Buscar"
    labelPlacement="floating"
    type="text"
  ></ion-input>
  <ion-button expand="block" (click)="searchUsers()">Buscar</ion-button>

  <!-- LISTA DE USUARIOS -->
  <ion-list>
    <ion-item *ngFor="let user of users">
      <ion-label>
        <h2>{{ user.nombre }}</h2>
        <p>ID: {{ user.id }}</p>
        <p>{{ user.correo }}</p>
        <p>{{ user.documento }}</p>
      </ion-label>
      <ion-button fill="clear" color="danger" (click)="deleteUser(user.id)">
        Eliminar
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
