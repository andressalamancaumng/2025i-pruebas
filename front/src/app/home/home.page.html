<ion-header>
  <ion-toolbar>
    <ion-title>Gestor de Carros</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="toggleDarkTheme()" fill="clear">
        <img [src]="iconMode" alt="modo oscuro" title="Cambiar modo" style="width: 40px; height: 40px;" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" style="display: flex; flex-direction: row; gap: 20px;">

  <!-- Panel Izquierdo: Registro -->
  <ion-card style="flex: 1; min-width: 300px;">
    <ion-card-header>
      <ion-card-title>Registrar nuevo carro</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form (ngSubmit)="agregarCarro()" #carroForm="ngForm">
        <ion-item>
          <ion-label position="floating">Modelo</ion-label>
          <ion-input type="number" [(ngModel)]="nuevoCarro.modelo" name="modelo" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Marca</ion-label>
          <ion-input type="text" [(ngModel)]="nuevoCarro.marca" name="marca" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Serie</ion-label>
          <ion-input type="text" [(ngModel)]="nuevoCarro.serie" name="serie" required></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" color="success">
          Agregar
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <!-- Panel Derecho: Lista -->
  <ion-card style="flex: 2; min-width: 400px; max-height: 600px; overflow-y: auto;">
    <ion-card-header>
      <ion-card-title>Lista de Carros Registrados</ion-card-title>
    </ion-card-header>

    <ion-list *ngIf="carros.length > 0; else sinCarros">
      <ion-item *ngFor="let carro of carros">
        <ion-label>
          <h2>{{ carro.modelo }} - {{ carro.marca }}</h2>
          <p>Serie: {{ carro.serie }}</p>
        </ion-label>
        <ion-button fill="clear" slot="end" color="danger" (click)="eliminarCarro(carro.id)">
          <ion-icon name="trash-outline"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-list>

    <ng-template #sinCarros>
      <ion-text color="medium"><p class="ion-padding">No hay carros registrados.</p></ion-text>
    </ng-template>
  </ion-card>

</ion-content>
