<ion-header>
  <ion-toolbar>
    <ion-title>Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (submit)="crearUsuario()">
      <ion-input [(ngModel)]="nuevoNombre" name="nombre" label="Nombre" label-placement="floating" fill="outline" >
    </ion-input>
    
    <ion-input [(ngModel)]="nuevoCorreo" name="correo" label="Correo" label-placement="floating" fill="outline" >
    </ion-input>  
     <ion-input [(ngModel)]="nuevoDocumento" name="Documento" label="Documento" label-placement="floating" fill="outline" >
    </ion-input>
    <br/>
    <ion-button expand="block" type="submit" class="Button-Action">
      Crear Usuario
    </ion-button>
    <ion-button expand="block" routerLink="/listado-usuarios" class="Button-Action">
      Volver
    </ion-button>
  </form>
</ion-content>
