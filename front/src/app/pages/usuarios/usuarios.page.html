<ion-header>
  <ion-toolbar>
    <ion-title>Vehículos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (submit)="crearVehiculo($event)">
    <ion-item>
      <ion-label position="floating">Modelo</ion-label>
      <ion-input type="number" [(ngModel)]="nuevoModelo" name="modelo"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Marca</ion-label>
      <ion-input type="text" [(ngModel)]="nuevaMarca" name="marca"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Serie</ion-label>
      <ion-input type="text" [(ngModel)]="nuevaSerie" name="serie"></ion-input>
    </ion-item>
    <ion-button expand="full" type="submit">Crear Vehículo</ion-button>
  </form>
</ion-content>
