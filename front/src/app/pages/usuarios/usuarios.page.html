<ion-header>
  <ion-toolbar>
    <ion-title>Peliculas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (submit)="crearPelicula($event)">
    <ion-item>
      <ion-label position="floating">Nombrepelicula</ion-label>
      <ion-input type="text" [(ngModel)]="nuevoNombrepelicula" name="nombrepelicula"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Director</ion-label>
      <ion-input type="text" [(ngModel)]="nuevaDirector" name="director"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Anio</ion-label>
      <ion-input type="number" [(ngModel)]="nuevaAnio" name="anio"></ion-input>
    </ion-item>
    <ion-button expand="full" type="submit">Crear Pelicula</ion-button>
  </form>
</ion-content>
