<ion-header>
  <ion-toolbar>
    <ion-title>Crear Película</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (submit)="crearPelicula()">
    <ion-item>
      <ion-label position="floating">Título</ion-label>
      <ion-input [(ngModel)]="nuevoTitulo" name="titulo"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Año</ion-label>
      <ion-input [(ngModel)]="nuevoAnio" name="anio" type="number"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Director</ion-label>
      <ion-input [(ngModel)]="nuevoDirector" name="director"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top">
      Crear Película
    </ion-button>
    <ion-button expand="block" color="danger" routerLink="/home" class="ion-margin-top">
      Cancelar
    </ion-button>
  </form>
</ion-content>
