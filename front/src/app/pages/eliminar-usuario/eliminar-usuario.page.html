<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Eliminar Usuario Por Id</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">eliminar-usuario</ion-title>
    </ion-toolbar>
  </ion-header>
    <ion-input [(ngModel)]="UserId" name="Id" label="Inserte Id del Usuario" label-placement="floating" fill="outline" >
    </ion-input>
  <br/>
  <ion-button class="Button-Action" expand="block" type="submit" >
      Eliminar Usuario
  </ion-button>
    <ion-button expand="block" type="button" (click)="volverAListado()" class="Button-Action">
    Volver
    </ion-button>
</ion-content>
