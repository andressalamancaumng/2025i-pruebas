<ion-header>
  <ion-toolbar>
    <ion-title>Listado de Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="floating">Buscar por Nombre</ion-label>
    <ion-input [(ngModel)]="nombreBuscar" type="text"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Buscar por Correo</ion-label>
    <ion-input [(ngModel)]="correoBuscar" type="email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Buscar por Documento</ion-label>
    <ion-input [(ngModel)]="documentoBuscar" type="text"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="buscarUsuario()">Buscar</ion-button>
  <ion-button expand="block" color="medium" (click)="limpiarBusqueda()">Limpiar</ion-button>

  <ion-list>
    <ion-item *ngFor="let usuario of usuarios">
      <ion-label>
        <h2>{{ usuario.nombre }}</h2>
        <p>Correo: {{ usuario.correo }}</p>
        <p>Documento: {{ usuario.documento }}</p>
        <p>ID: {{ usuario.id }}</p>
      </ion-label>
      <ion-button color="danger" slot="end" (click)="eliminarUsuario(usuario.id)">
        Eliminar
      </ion-button>
    </ion-item>
  </ion-list>

</ion-content>
