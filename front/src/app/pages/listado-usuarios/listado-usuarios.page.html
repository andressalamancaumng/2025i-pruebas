<ion-header>
  <ion-toolbar>
    <ion-title>Listado de Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input [(ngModel)]="nombre" placeholder="Buscar por nombre"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input [(ngModel)]="correo" placeholder="Buscar por correo"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input [(ngModel)]="documento" placeholder="Buscar por documento"></ion-input>
  </ion-item>

  <ion-button expand="block" (click)="buscar()">Buscar</ion-button>
  <ion-button expand="block" color="medium" (click)="limpiarCampos()">Limpiar</ion-button>

  <ion-text color="danger" *ngIf="mensaje">
    <p>{{ mensaje }}</p>
  </ion-text>

  <ion-list *ngIf="usuarios.length">
    <ion-item *ngFor="let user of usuarios">
      <ion-label>
        <h2>{{ user.nombre }}</h2>
        <p>Correo: {{ user.correo }}</p>
        <p>Documento: {{ user.documento }}</p>
      </ion-label>
      <ion-button slot="end" color="danger" (click)="eliminar(user.id)">Eliminar</ion-button>
    </ion-item>
  </ion-list>
</ion-content>
