<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Películas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!--
  <ion-list>
    <ion-item *ngFor="let usuario of usuarios">
      <ion-label>
        <h2>{{ usuario.name }}</h2>
        <p>{{ usuario.email }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
  -->
  
  <div>
    <ion-button routerLink="/usuarios" class="ion-margin-top" type="button">
     Crear película
    </ion-button>
  </div>

  <div>
    <ion-button (click)="traerPelis()" class="ion-margin-top" type="button">
      Traer todos
    </ion-button>
  </div>

  <div>
    <ion-item>
      <ion-label position="floating">Digita el ID de la pelúcula a buscar</ion-label>
      <ion-input [(ngModel)]="IDb"></ion-input>
      <ion-button (click)="buscaPelicula()" type="button">Buscar</ion-button>
    </ion-item>
  </div>
  
  <div>
   <ion-item>
    <ion-label position="floating">Digita el ID de la película a eliminar</ion-label>
    <ion-input [(ngModel)]="IDe"></ion-input>
     <ion-button (click)="eliminaPelicula()" type="button" color="danger">Eliminar</ion-button>
   </ion-item>
  
  </div>

  <div *ngIf="busca">
    <ion-item>
      <ion-label position="floating">Digita el ID de la película</ion-label>
      <ion-input [(ngModel)]="IDb"></ion-input>
    </ion-item>
    <ion-button (click)="buscaPelicula()" class="ion-margin-top" type="button">Buscar</ion-button>
  </div>
  <div *ngIf="encontrar">
   <!--Se va a crear una ion-card para visualizar los datos solicitados-->
   <ion-card>
    <ion-card-header>
      <ion-card-title>{{encontrar.titulo}}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>ID: </strong> {{encontrar.ID}}</p>
      <p><strong>Año: </strong> {{encontrar.year}}</p>
      <p><strong>Director: </strong> {{encontrar.director}}</p>
    </ion-card-content>
   </ion-card>
  </div>

</ion-content>
