<ion-header>
  <ion-toolbar>
    <ion-title>Usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (submit)="crearUsuario()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input [(ngModel)]="nuevoUsuario.nombre" name="nombre" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input [(ngModel)]="nuevoUsuario.correo" name="correo" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Documento</ion-label>
      <ion-input [(ngModel)]="nuevoUsuario.documento" name="documento" required></ion-input>
    </ion-item>
    <ion-button expand="block" type="submit" class="ion-margin-top">Crear Usuario</ion-button>
  </form>

  <ion-list>
    <ion-item *ngFor="let usuario of usuarios">
      <ion-label>
        <h2>{{ usuario.nombre }}</h2>
        <p>{{ usuario.correo }}</p>
        <p><strong>Documento:</strong> {{ usuario.documento }}</p>
      </ion-label>
      <ion-button color="danger" fill="clear" slot="end" (click)="eliminarUsuario(usuario.id)">
        Eliminar
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
