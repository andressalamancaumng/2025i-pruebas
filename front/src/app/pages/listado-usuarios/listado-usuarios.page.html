<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Listado usuarios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let usuario of usuarios">
      <ion-label>
        <h2>{{ usuario.nombre }}</h2>
        <p>{{ usuario.correo }}</p>
        <p>{{ usuario.documento }}</p>
      </ion-label>
      <ion-button fill="clear" color="danger" slot="end" (click)="eliminarUsuario(usuario.id)">
        Eliminar
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-item>
    <ion-input label="Nombre" [(ngModel)]="nuevoUsuario.nombre"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Correo" [(ngModel)]="nuevoUsuario.correo"></ion-input>
  </ion-item>
  <ion-item>
    <ion-input label="Documento" [(ngModel)]="nuevoUsuario.documento"></ion-input>
  </ion-item>
  <ion-button expand="block" (click)="crearUsuario()">Crear Usuario</ion-button>
</ion-content>
