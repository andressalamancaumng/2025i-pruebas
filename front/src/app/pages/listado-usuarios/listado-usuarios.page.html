<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Películas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!--
  <ion-list>
    <ion-item *ngFor="let usuario of usuarios">
      <ion-label>
        <h2>{{ usuario.name }}</h2>
        <p>{{ usuario.email }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
  -->
  
  <div>
    <ion-button routerLink="/usuarios" class="ion-margin-top" type="button">
     Crear película
    </ion-button>
  </div>

  <div>
    <ion-button  class="ion-margin-top" type="button">
      Traer todos
    </ion-button>
  </div>

  <div>
    <ion-button (click)="buscaID('busca')" class="ion-margin-top" type="button">
      Traer por id
    </ion-button>
  </div>
  
  <div>
    <ion-button (click)="buscaID('elimina')"  class="ion-margin-top" type="button" color="danger">
      Eliminar por id
    </ion-button>
  </div>

  <div *ngIf="busca">
    <ion-item>
      <ion-label position="floating">Digita el ID de la película</ion-label>
      <ion-input [(ngModel)]="ID"></ion-input>
    </ion-item>
    <ion-button (click)="buscaPelicula()" class="ion-margin-top" type="button">Buscar</ion-button>
  </div>
  <div *ngIf="encontrar">
    <p>PELICULA ENCONTRADA</p>
  </div>

</ion-content>
