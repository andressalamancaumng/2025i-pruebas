<ion-header>
  <ion-toolbar>
    <ion-title>Listado de Carros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="crearCarro()">
    <ion-item>
      <ion-label position="floating">Modelo</ion-label>
      <ion-input type="number" [(ngModel)]="modelo" name="modelo" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Marca</ion-label>
      <ion-input type="text" [(ngModel)]="marca" name="marca" required></ion-input>
    </ion-item>
    <ion-button expand="block" type="submit" [disabled]="!modelo || !marca.trim()">Crear Carro</ion-button>
  </form>

  <ion-list>
    <ion-item *ngFor="let carro of carros">
      <ion-label>
        <h2>Marca: {{ carro.marca }}</h2>
        <p>Modelo: {{ carro.modelo }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
