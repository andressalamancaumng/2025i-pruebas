<ion-header>
  <ion-toolbar>
    <ion-title>Carros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (submit)="crearCarro()">
 <!-- Texto modelo carro -->
    <ion-item>
      <ion-label position="floating">Modelo</ion-label>
      <ion-input [(ngModel)]="nuevoModelo" name="modelo"></ion-input>
    </ion-item>
 <!-- Texto marca carro -->
    <ion-item>
      <ion-label position="floating">Marca</ion-label>
      <ion-input [(ngModel)]="nuevaMarca" name="marca"></ion-input>
    </ion-item>
 <!-- Texto serie carro -->
    <ion-item>
      <ion-label position="floating">Serie</ion-label>
      <ion-input [(ngModel)]="nuevaSerie" name="serie"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top">
      Crear Carro
    </ion-button>
    
    <ion-button expand="block" color="danger" routerLink="/listado-carros" class="ion-margin-top">
      Cancelar
    </ion-button>
  </form>
</ion-content>
