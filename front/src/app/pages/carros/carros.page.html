<ion-header>
  <ion-toolbar>
    <ion-title>Nuevo Carro</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="crearCarro()">
    <ion-item>
      <ion-label position="floating">Marca</ion-label>
      <ion-input [(ngModel)]="marca" name="name" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Modelo</ion-label>
      <ion-input [(ngModel)]="modelo" name="modelo" type="number" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Serie</ion-label>
      <ion-input [(ngModel)]="serie" name="serie" required></ion-input>
    </ion-item>
    <ion-button expand="block" type="submit">Crear Carro</ion-button>
    <ion-button expand="block" routerLink="/listado-carros">Ver Lista</ion-button>
  </form>

</ion-content>
