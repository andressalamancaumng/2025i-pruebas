<ion-header>
  <ion-toolbar>
    <ion-title>Nuevo Carro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="crearCarro()">
    <ion-item>
      <ion-label position="floating">Modelo</ion-label>
      <ion-input type="number" [(ngModel)]="modelo" name="modelo" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Marca</ion-label>
      <ion-input [(ngModel)]="marca" name="marca" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Serie</ion-label>
      <ion-input [(ngModel)]="serie" name="serie" required></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top">
      Guardar
    </ion-button>
  </form>
</ion-content>
