<main class="container">
  <h1 class="title">Lista de películas</h1>
  <div class="header-actions">
    <button class="nav-button" routerLink="/peliculas">
      Agregar Pelicula
    </button>
    <input
    [(ngModel)]="searchTerm"
    (ngModelChange)="applyFilter()"
    type="text"
    class="search-bar"
    placeholder="Buscar pelicula"
  />
  </div>

  <section class="movie-list">
    <div class="movie-card" *ngFor="let movie of filteredMovies">
  <div class="movie-content">
    <h2 class="movie-name">{{ movie.name }}</h2>
    <p class="movie-director">Director: {{ movie.director }}</p>
    <span class="year">Año: {{ movie.year }}</span>
  </div>
  <button class="btn-delete" (click)="deleteMovie(movie.id)">Eliminar</button>
</div>
  </section>
</main>
