<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Listado de carros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let carro of carros">
      <ion-label>
        <h2>Marca: {{ carro.marca }}</h2>
        <p>Modelo: {{ carro.modelo }}</p>
        <p>Serie: {{ carro.serie }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-button expand="block" routerLink="/crear-carro" class="ion-margin-top" type="button">
    Crear Carro
  </ion-button>
</ion-content>
